<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Регистрация — Самоконтроль подготовки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/app/app.css?v=18" />
</head>
<body>
  <div class="page">
    <header class="header site-header site-header-main">
      <div class="site-header-main-inner">
        <div class="site-header-main-left">
          <span class="site-brand-text">Самоконтроль подготовки</span>
        </div>
        <div class="site-header-main-right">
          <a class="btn" href="/app/login.html" data-i18n="nav.login">Войти</a>
        </div>
      </div>
    </header>

    <div class="auth-layout">
      <div class="auth-card">
        <p class="auth-title">Создать аккаунт</p>
        <p class="auth-subtitle">Зарегистрируйтесь, чтобы начать подготовку</p>

        <div class="form-group">
          <label for="reg-name">ФИО</label>
          <input id="reg-name" type="text" placeholder="Иванов Иван Иванович" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="student@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="reg-pass">Пароль</label>
          <input id="reg-pass" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" />
        </div>

        <div class="form-error" id="reg-error"></div>

        <button class="btn btn-primary" id="btn-register" style="width:100%;margin-top:4px;">
          Зарегистрироваться
        </button>

        <div class="auth-switch">
          Уже есть аккаунт? <a href="/app/login.html">Войти</a>
        </div>

        <p class="muted small" style="margin:12px 0 0; text-align:center;">
          Создаётся аккаунт студента. Роль преподавателя назначает администратор.
        </p>
      </div>
    </div>
  </div>

  <script src="/app/app.js?v=18"></script>
  <script>
    // Auto-redirect if already logged in
    (function() {
      const token = Api.getToken();
      const payload = token ? Api.decodeJwt(token) : null;
      if (payload && payload.sub && payload.exp && payload.exp * 1000 > Date.now()) {
        window.location.replace("/app/dashboard.html");
      }
    })();

    const regError = document.getElementById("reg-error");
    const regBtn = document.getElementById("btn-register");

    function showError(msg) {
      regError.textContent = msg;
      regError.classList.add("visible");
    }
    function clearError() {
      regError.classList.remove("visible");
    }

    async function doRegister() {
      const full_name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-pass").value.trim();

      if (!full_name || !email || !password) {
        showError("Заполните ФИО, email и пароль");
        return;
      }
      if (password.length < 6) {
        showError("Пароль должен быть не менее 6 символов");
        return;
      }

      clearError();
      regBtn.disabled = true;
      regBtn.textContent = "Регистрируем…";

      try {
        await Api.request("/auth/register", {
          method: "POST",
          body: { full_name, email, password, role: "student" },
        });
        window.location.href = `/app/login.html?registered_email=${encodeURIComponent(email)}`;
      } catch (e) {
        const raw = e.message || "";
        let msg = "Ошибка регистрации. Попробуйте снова.";
        try {
          const obj = JSON.parse(raw);
          if (obj.detail) msg = obj.detail;
        } catch {}
        showError(msg);
        regBtn.disabled = false;
        regBtn.textContent = "Зарегистрироваться";
      }
    }

    regBtn.addEventListener("click", doRegister);
    document.getElementById("reg-pass").addEventListener("keydown", e => {
      if (e.key === "Enter") doRegister();
    });
    document.getElementById("reg-email").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("reg-pass").focus();
    });
    document.getElementById("reg-name").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("reg-email").focus();
    });

    applyI18n(document);
  </script>
</body>
</html>
