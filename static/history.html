<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title data-i18n-title="history.title">История попыток — Самоконтроль подготовки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/app/app.css?v=18" />
</head>
<body>
  <div class="page">
    <header class="header site-header site-header-main">
      <div class="site-header-main-inner">
        <div class="site-header-main-left">
          <a class="btn" href="/app/dashboard.html" data-i18n="nav.dashboard">Кабинет</a>
        </div>
        <div class="site-header-main-right">
          <a class="btn" href="/app/test.html" data-i18n="nav.test">Пройти тест</a>
          <a class="btn btn-primary" href="/app/history.html" data-i18n="nav.history">История</a>
          <a class="btn" href="/app/plan.html" data-i18n="nav.plan">План</a>
          <a class="btn" href="/app/analytics.html" data-i18n="nav.analytics">Аналитика</a>
          <button class="btn btn-danger" id="btn-exit" type="button" data-i18n="nav.logout">Выйти</button>
        </div>
      </div>
    </header>

    <div class="analytics-page-hero">
      <div>
        <div class="section-title" data-i18n="history.header">История попыток</div>
        <div class="muted" data-i18n="history.subtitle">Список всех завершённых тестов с баллами, типом и слабыми темами.</div>
      </div>
      <button class="btn" id="btn-refresh-history" type="button" data-i18n="common.refresh">Обновить</button>
    </div>

    <div class="analytics-page-section-title" data-i18n="history.attempts">Попытки</div>
    <div id="analytics-history" class="analytics-shell"></div>
  </div>

  <script src="/app/app.js?v=18"></script>
  <script>
    I18N.ru["history.title"] = "История попыток — Самоконтроль подготовки";
    I18N.kz["history.title"] = "Тапсыру тарихы — Дайындықты өзін-өзі бақылау";
    I18N.ru["history.header"] = "История попыток";
    I18N.kz["history.header"] = "Тапсыру тарихы";
    I18N.ru["history.subtitle"] = "Список всех завершённых тестов с баллами, типом и слабыми темами.";
    I18N.kz["history.subtitle"] = "Барлық аяқталған тесттердің баллдары, түрі және әлсіз тақырыптары көрсетілген тізім.";
    I18N.ru["history.attempts"] = "Попытки";
    I18N.kz["history.attempts"] = "Талпыныстар";
    I18N.ru["history.no_weak_topics"] = "Нет выраженных слабых тем";
    I18N.kz["history.no_weak_topics"] = "Айқын әлсіз тақырыптар жоқ";
    I18N.ru["history.no_items"] = "История попыток пока пуста.";
    I18N.kz["history.no_items"] = "Тапсыру тарихы әзірге бос.";
    I18N.ru["history.type"] = "Тип";
    I18N.kz["history.type"] = "Түрі";
    I18N.ru["history.correct"] = "Правильных";
    I18N.kz["history.correct"] = "Дұрыс жауап";
    I18N.ru["history.level"] = "Уровень";
    I18N.kz["history.level"] = "Деңгей";
    I18N.ru["history.weak_topics"] = "Слабые темы";
    I18N.kz["history.weak_topics"] = "Әлсіз тақырыптар";

    const payload = requireAuthOrRedirect();
    if (!payload) { /* redirected */ }

    function $(id) { return document.getElementById(id); }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatTopicStats(items) {
      if (!items || items.length === 0) return t("history.no_weak_topics");
      return items.map(item => `${item.topic_name} (${item.mistakes})`).join(", ");
    }

    function setPlaceholder(id, text, isError = false) {
      const el = $(id);
      if (!el) return;
      el.innerHTML = `<div class="analytics-empty${isError ? " error" : ""}">${escapeHtml(text)}</div>`;
    }

    function scoreClass(score) {
      if (score >= 80) return "history-badge-high";
      if (score >= 50) return "history-badge-medium";
      return "history-badge-low";
    }

    function renderHistory(items) {
      const el = $("analytics-history");
      if (!items || items.length === 0) {
        setPlaceholder("analytics-history", t("history.no_items"));
        return;
      }

      el.innerHTML = `
        <div class="analytics-page-list">
          ${items.map(item => `
            <div class="analytics-page-card">
              <div class="analytics-page-card-head">
                <div class="analytics-page-card-title">${escapeHtml(translateSubjectName(item.subject_name))}</div>
                <div class="history-score-badge ${scoreClass(item.score)}">${escapeHtml(item.score)}%</div>
              </div>
              <div class="analytics-page-card-meta">
                <span>${escapeHtml(translateTestType(item.test_type))}</span>
                <span>${escapeHtml(item.correct_answers)}/${escapeHtml(item.total_questions)} правильных</span>
                <span>${escapeHtml(translateLevel(item.level))}</span>
                <span>${escapeHtml(formatDateTime(item.created_at))}</span>
              </div>
              ${item.weak_topics && item.weak_topics.length > 0 ? `
              <div style="margin-top:8px;">
                <span class="muted small">Слабые темы: </span>
                <span class="wrong-q-chips">
                  ${item.weak_topics.map(wt => `<span class="wrong-q-chip">${escapeHtml(wt.topic_name)} ×${escapeHtml(String(wt.mistakes))}</span>`).join("")}
                </span>
              </div>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    async function loadHistory() {
      try {
        const items = await Api.request("/tests/history", { auth: true });
        renderHistory(items);
      } catch (e) {
        if (e.message === "SESSION_EXPIRED") return;
        setPlaceholder("analytics-history", e.message, true);
      }
    }

    $("btn-refresh-history").addEventListener("click", loadHistory);
    $("btn-exit").onclick = () => { Api.setToken(null); window.location.href = "/app/"; };
    applyI18n(document);
    loadHistory();
  </script>
</body>
</html>
