        <div class="section-title" data-i18n="analytics.personal">Персональная аналитика</div>

      </div>

    <div class="tabs" id="analytics-tabs" style="margin-top:8px;">
      <button class="tab active" data-tab="progress">Прогресс</button>
      <button class="tab" data-tab="ml">Интеллектуальный модуль</button>
      <button class="tab" data-tab="ai">AI-ассистент</button>
    </div>

    <!-- Вкладка 1: Прогресс -->

      <div id="analytics-progress" class="analytics-shell"></div>
    </div>

    <!-- Вкладка 2: ML-модуль -->

      <div class="analytics-page-grid" style="margin-top:20px;">
        <div>
          <div class="analytics-page-section-title">Кластеризация</div>
          <div id="analytics-cluster" class="analytics-shell"></div>
        </div>

          <div id="analytics-ml-recs" class="analytics-shell"></div>
        </div>
      </div>

      <div class="analytics-page-section-title" style="margin-top:24px;" data-i18n="analytics.study_vector">Персональный учебный план</div>
      <div id="analytics-recommendations" class="analytics-shell"></div>
    </div>

    <!-- Вкладка 3: AI-ассистент -->
    <div id="tab-ai" class="panel">
      <div style="margin-top:20px;">
        <div class="analytics-page-card">
          <div id="ai-chat-log" class="analytics-page-list" style="max-height: 340px; overflow-y: auto; margin-bottom: 12px;"></div>
          <div style="display:flex; gap:8px;">

            <button class="btn btn-primary" id="btn-ai-send" type="button">Спросить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

    const payload = requireAuthOrRedirect();
    if (!payload) { /* redirected */ }

    function $(id) { return document.getElementById(id); }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatTopicStats(items) {
      if (!items || items.length === 0) return t("analytics.no_weak_topics");
      return items.map(item => `${item.topic_name} (${item.mistakes})`).join(", ");
    }

    function setPlaceholder(id, text, isError = false) {
      const el = $(id);
      if (!el) return;
      el.innerHTML = `<div class="analytics-empty${isError ? " error" : ""}">${escapeHtml(text)}</div>`;
    }

    function setWhoAmI() {
      const el = $("analytics-whoami");
      if (el) el.textContent = t("analytics.personal_sub");
    }

    function shortSubjectName(name, maxLength = 18) {
      if (!name) return "—";
      return name.length > maxLength ? name.slice(0, maxLength - 1) + "…" : name;
    }

    function getScoreTone(score) {
      const value = Number(score || 0);
      if (value < 60) return "low";
      if (value < 85) return "medium";
      return "high";
    }

    function scoreToneClass(score, base) {
      return `${base}-${getScoreTone(score)}`;
    }

    function toneDescription(score) {
      const tone = getScoreTone(score);
      if (tone === "low") return t("analytics.low_risk");
      if (tone === "medium") return t("analytics.medium_risk");
      return t("analytics.high_risk");
    }

    function renderLineChart(history) {
      if (!history || history.length === 0) {
        return `<div class="analytics-empty">${escapeHtml(t("analytics.no_chart_history"))}</div>`;
      }

      const items = history.slice(0, 8).reverse();
      const width = 620;
      const height = 260;
      const padding = { top: 18, right: 18, bottom: 36, left: 40 };
      const innerWidth = width - padding.left - padding.right;
      const innerHeight = height - padding.top - padding.bottom;
      const levels = [0, 25, 50, 75, 100];

      const points = items.map((item, index) => {
        const x = padding.left + (items.length === 1 ? innerWidth / 2 : (index * innerWidth) / (items.length - 1));
        const y = padding.top + innerHeight - (Number(item.score || 0) / 100) * innerHeight;
        return { x, y, item };
      });

      const polyline = points.map(point => `${point.x},${point.y}`).join(" ");
      const grid = levels.map(level => {
        const y = padding.top + innerHeight - (level / 100) * innerHeight;
        return `
          <line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" class="chart-grid-line"></line>
          <text x="${padding.left - 8}" y="${y + 4}" text-anchor="end" class="chart-axis-text">${level}</text>
        `;
      }).join("");

      const labels = points.map((point, index) => `
        <text x="${point.x}" y="${height - 10}" text-anchor="middle" class="chart-axis-text">${index + 1}</text>
      `).join("");

      const dots = points.map(point => `
        <circle cx="${point.x}" cy="${point.y}" r="5" class="${scoreToneClass(point.item.score, "chart-point")}"></circle>
        <title>${point.item.subject_name}: ${point.item.score}%</title>
      `).join("");

      return `
        <svg viewBox="0 0 ${width} ${height}" class="analytics-chart-svg" role="img" aria-label="${escapeHtml(t("analytics.line_aria"))}">
          ${grid}
          <polyline points="${polyline}" class="chart-line"></polyline>
          ${dots}
          ${labels}
        </svg>
        <div class="analytics-chart-caption">${escapeHtml(t("analytics.line_caption"))}</div>
      `;
    }

    function renderBarChart(subjects) {
      if (!subjects || subjects.length === 0) {
        return `<div class="analytics-empty">${escapeHtml(t("analytics.no_chart_subjects"))}</div>`;
      }

      const items = subjects.slice(0, 8);
      const width = 620;
      const rowHeight = 34;
      const gap = 14;
      const padding = { top: 16, right: 24, bottom: 12, left: 150 };
      const height = padding.top + padding.bottom + items.length * rowHeight + (items.length - 1) * gap;
      const maxBarWidth = width - padding.left - padding.right;

      const bars = items.map((subject, index) => {
        const y = padding.top + index * (rowHeight + gap);
        const barWidth = Math.max(8, (Number(subject.average_score || 0) / 100) * maxBarWidth);
        return `
          <text x="${padding.left - 12}" y="${y + 21}" text-anchor="end" class="chart-axis-text">${escapeHtml(shortSubjectName(translateSubjectName(subject.subject_name), 20))}</text>
          <rect x="${padding.left}" y="${y}" width="${maxBarWidth}" height="${rowHeight}" rx="10" class="chart-bar-track"></rect>
          <rect x="${padding.left}" y="${y}" width="${barWidth}" height="${rowHeight}" rx="10" class="${scoreToneClass(subject.average_score, "chart-bar-fill")}"></rect>
          <text x="${padding.left + Math.min(barWidth + 10, maxBarWidth - 8)}" y="${y + 21}" class="chart-value-text">${escapeHtml(subject.average_score)}%</text>
        `;
      }).join("");

      return `
        <svg viewBox="0 0 ${width} ${height}" class="analytics-chart-svg" role="img" aria-label="${escapeHtml(t("analytics.bar_aria"))}">
          ${bars}
        </svg>
        <div class="analytics-chart-caption">${escapeHtml(t("analytics.bar_caption"))}</div>
      `;
    }

    function renderRadarChart(subjects) {
      if (!subjects || subjects.length < 3) {
        return `<div class="analytics-empty">${escapeHtml(t("analytics.no_chart_radar"))}</div>`;
      }

      const items = subjects.slice(0, 8);
      const size = 360;
      const center = size / 2;
      const radius = 110;
      const levels = [25, 50, 75, 100];
      const angleStep = (Math.PI * 2) / items.length;

      function pointFor(value, index, extraRadius = 0) {
        const angle = -Math.PI / 2 + index * angleStep;
        const localRadius = (value / 100) * radius + extraRadius;
        return {
          x: center + Math.cos(angle) * localRadius,
          y: center + Math.sin(angle) * localRadius,
        };
      }

      const grid = levels.map(level => {
        const polygon = items.map((_, index) => {
          const point = pointFor(level, index);
          return `${point.x},${point.y}`;
        }).join(" ");
        return `<polygon points="${polygon}" class="chart-radar-grid"></polygon>`;
      }).join("");

      const axes = items.map((subject, index) => {
        const end = pointFor(100, index);
        const labelPoint = pointFor(100, index, 22);
        return `
          <line x1="${center}" y1="${center}" x2="${end.x}" y2="${end.y}" class="chart-radar-axis"></line>
          <text x="${labelPoint.x}" y="${labelPoint.y}" text-anchor="middle" class="chart-axis-text">${index + 1}</text>
        `;
      }).join("");

      const dataPolygon = items.map((subject, index) => {
        const point = pointFor(Number(subject.average_score || 0), index);
        return `${point.x},${point.y}`;
      }).join(" ");

      return `
        <svg viewBox="0 0 ${size} ${size}" class="analytics-chart-svg analytics-chart-svg-radar" role="img" aria-label="${escapeHtml(t("analytics.radar_aria"))}">
          ${grid}
          ${axes}
          <polygon points="${dataPolygon}" class="chart-radar-fill"></polygon>
          <polyline points="${dataPolygon}" class="chart-radar-line"></polyline>
        </svg>
        <div class="analytics-chart-legend">
          ${items.map((subject, index) => `<span><strong>${index + 1}</strong> — ${escapeHtml(translateSubjectName(subject.subject_name))}</span>`).join("")}
        </div>
      `;
    }

    function renderGauge(score) {
      const safeScore = Math.max(0, Math.min(100, Number(score || 0)));
      const R = 80, cx = 110, cy = 110;
      const circ = 2 * Math.PI * R;
      const offset = (circ * (1 - safeScore / 100)).toFixed(2);
      const tone = getScoreTone(safeScore);
      const color = tone === "low" ? "#ef4444" : tone === "medium" ? "#f59e0b" : "#22c55e";
      const glowClass = `glow-${tone}`;
      const labelText = t("analytics.avg_readiness") || "Средняя готовность";
      return `
        <div class="analytics-gauge ${glowClass}">
          <svg viewBox="0 0 220 220" width="200" height="200" style="display:block;margin:0 auto;" role="img" aria-label="${escapeHtml(labelText)}">
            <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(100,116,139,0.13)" stroke-width="18"/>
            <circle cx="${cx}" cy="${cy}" r="${R}" fill="none"
              stroke="${color}" stroke-width="18" stroke-linecap="round"
              stroke-dasharray="${circ.toFixed(2)}"
              stroke-dashoffset="${offset}"
              transform="rotate(-90 ${cx} ${cy})"/>
            <text x="${cx}" y="${cy - 6}" text-anchor="middle" dominant-baseline="middle"
              style="font-size:32px;font-weight:800;fill:${color};">${safeScore}%</text>
            <text x="${cx}" y="${cy + 22}" text-anchor="middle"

    // Цвета кластеров (по cluster_id)
    const CLUSTER_COLORS = ["#6f7dff", "#f59e0b", "#ef4444", "#22c55e"];

    function renderFeatureBar(label, value, maxValue, color) {
      const pct = maxValue > 0 ? Math.min(100, Math.round(Math.abs(Number(value)) / maxValue * 100)) : 0;
      const numVal = Number(value);
      const sign = numVal > 0 ? "+" : "";
      const displayVal = Number.isInteger(numVal) ? numVal : numVal.toFixed(1);
      return `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
            <span style="font-size:13px;color:var(--text-soft)">${escapeHtml(label)}</span>
            <span style="font-size:13px;font-weight:600;color:${color}">${escapeHtml(sign + String(displayVal))}</span>
          </div>
          <div style="height:7px;border-radius:8px;background:var(--border);overflow:hidden;">
            <div style="height:100%;width:${pct}%;border-radius:8px;background:${color};transition:width 0.6s ease;"></div>
          </div>
        </div>
      `;
    }

    function renderScatterPlot(scatterPoints, clusterCenters, userClusterId) {
      if (!scatterPoints || scatterPoints.length === 0) return "";

      const W = 440, H = 290;
      const pad = { top: 28, right: 52, bottom: 44, left: 46 };
      const iW = W - pad.left - pad.right;
      const iH = H - pad.top - pad.bottom;

      // Clamped coordinate functions — точки не вылезают за края
      function px(xNorm) { return pad.left + Math.min(Math.max(xNorm, 0), 1) * iW; }
      function py(yNorm) { return pad.top + (1 - Math.min(Math.max(yNorm, 0), 1)) * iH; }

      const selfPt = scatterPoints.find(p => p.is_self);
      const selfX = selfPt ? Math.round(selfPt.x * 100) : null;
      const selfY = selfPt ? Math.round(selfPt.y * 100) : null;

      // Определяем квадрант пользователя
      let userQuadrant = "", quadrantColor = "#64748B";
      if (selfPt) {
        if (selfPt.x >= 0.5 && selfPt.y >= 0.5)       { userQuadrant = "Отличник";      quadrantColor = "#16A34A"; }
        else if (selfPt.x < 0.5 && selfPt.y >= 0.5)   { userQuadrant = "Способный";     quadrantColor = "#D97706"; }
        else if (selfPt.x >= 0.5 && selfPt.y < 0.5)   { userQuadrant = "Старательный";  quadrantColor = "#2563EB"; }
        else                                             { userQuadrant = "Нужна работа"; quadrantColor = "#DC2626"; }
      }

      // Фоны квадрантов
      const quadBg = `
        <rect x="${pad.left}"  y="${pad.top}"   width="${iW/2}" height="${iH/2}" fill="rgba(217,119,6,0.06)"/>
        <rect x="${px(0.5)}"   y="${pad.top}"   width="${iW/2}" height="${iH/2}" fill="rgba(22,163,74,0.06)"/>
        <rect x="${pad.left}"  y="${py(0.5)}"   width="${iW/2}" height="${iH/2}" fill="rgba(220,38,38,0.06)"/>
        <rect x="${px(0.5)}"   y="${py(0.5)}"   width="${iW/2}" height="${iH/2}" fill="rgba(37,99,235,0.06)"/>
        <text x="${pad.left+5}"       y="${pad.top+13}"        style="font-size:9px;fill:rgba(180,120,0,0.65);font-weight:600;">Способный</text>
        <text x="${W-pad.right-5}"    y="${pad.top+13}"        text-anchor="end" style="font-size:9px;fill:rgba(22,163,74,0.75);font-weight:600;">Отличник</text>
        <text x="${pad.left+5}"       y="${H-pad.bottom-5}"    style="font-size:9px;fill:rgba(220,38,38,0.65);font-weight:600;">Нужна работа</text>
        <text x="${W-pad.right-5}"    y="${H-pad.bottom-5}"    text-anchor="end" style="font-size:9px;fill:rgba(37,99,235,0.65);font-weight:600;">Старательный</text>
      `;

      // Разделители квадрантов
      const dividers = `
        <line x1="${px(0.5)}" y1="${pad.top}"       x2="${px(0.5)}" y2="${H-pad.bottom}" stroke="rgba(0,0,0,0.09)" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="${pad.left}" y1="${py(0.5)}"       x2="${W-pad.right}" y2="${py(0.5)}" stroke="rgba(0,0,0,0.09)" stroke-width="1" stroke-dasharray="4,3"/>
      `;

      // Подписи осей (пропускаем 0 во избежание артефакта 0,0)
      const gridLabels = [25, 50, 75, 100].map(v => {
        const nv = v / 100;
        return `
          <text x="${pad.left-5}" y="${py(nv)+4}" text-anchor="end" style="font-size:10px;fill:#94A3B8;">${v}</text>
          <text x="${px(nv)}" y="${H-pad.bottom+13}" text-anchor="middle" style="font-size:10px;fill:#94A3B8;">${v}</text>
        `;
      }).join("");

      // Другие студенты — серые точки
      const peerDots = scatterPoints.filter(p => !p.is_self).map(pt => `
        <circle cx="${px(pt.x)}" cy="${py(pt.y)}" r="4" fill="#CBD5E1" stroke="white" stroke-width="0.8">
          <title>Активность ${Math.round(pt.x*100)}%, балл ${Math.round(pt.y*100)}%</title>
        </circle>`
      ).join("");

      // Точка "Вы" — всегда видна, не обрезается
      const selfDot = selfPt ? (() => {
        const cx = px(selfPt.x);
        const cy = py(selfPt.y);
        const lx = selfPt.x > 0.75 ? cx - 13 : cx + 13;
        const la = selfPt.x > 0.75 ? "end" : "start";
        const ly = selfPt.y > 0.88 ? cy + 18 : cy - 13;
        return `
          <circle cx="${cx}" cy="${cy}" r="18" fill="${quadrantColor}" opacity="0.10"/>
          <circle cx="${cx}" cy="${cy}" r="8"  fill="${quadrantColor}" stroke="white" stroke-width="2.5"/>
          <text x="${lx}" y="${ly}" text-anchor="${la}" style="font-size:11px;font-weight:700;fill:${quadrantColor};">Вы</text>
        `;
      })() : "";

      // Оси
      const axes = `
        <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${H-pad.bottom}" stroke="#94A3B8" stroke-width="1.5"/>
        <line x1="${pad.left}" y1="${H-pad.bottom}" x2="${W-pad.right}" y2="${H-pad.bottom}" stroke="#94A3B8" stroke-width="1.5"/>
        <text x="${pad.left}" y="${pad.top-8}" style="font-size:10px;fill:#64748B;font-weight:600;">↑ Средний балл (%)</text>
        <text x="${W-pad.right}" y="${H-pad.bottom+28}" text-anchor="end" style="font-size:10px;fill:#64748B;font-weight:600;">Частота тестов (%) →</text>
      `;

      // Вывод что означает позиция
      const quadrantDesc = {
        "Отличник":     "Часто тестируетесь и показываете высокий результат — продолжайте в том же духе",
        "Способный":    "Высокий балл при редких тестах — тестируйтесь чаще, чтобы закрепить результат",
        "Старательный": "Часто тестируетесь — продолжайте практику, результаты со временем подтянутся",
        "Нужна работа": "Мало практики и низкий балл — стоит увеличить частоту тестов и изучить слабые темы",
      };

      const summaryBlock = selfPt ? `
        <div style="margin-top:14px;padding:12px 16px;border-radius:10px;background:${quadrantColor}14;border:1px solid ${quadrantColor}28;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748B;margin-bottom:4px;">Ваша позиция на карте</div>
          <div style="font-size:15px;font-weight:700;color:${quadrantColor};margin-bottom:3px;">${userQuadrant} &nbsp;·&nbsp; активность ${selfX}% &nbsp;·&nbsp; средний балл ${selfY}%</div>
          <div style="font-size:13px;color:#475569;line-height:1.5;">${quadrantDesc[userQuadrant] || ""}</div>
        </div>
      ` : "";

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block;margin:0 auto;" role="img" aria-label="Карта успеваемости">
          ${quadBg}${dividers}${gridLabels}${peerDots}${selfDot}${axes}
        </svg>
        <div style="display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:12px;color:#64748B;">
          <span style="display:flex;align-items:center;gap:5px;">
            <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="${quadrantColor}" stroke="white" stroke-width="2"/></svg>
            <strong>Вы</strong>
          </span>
          <span style="display:flex;align-items:center;gap:5px;">
            <svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#CBD5E1" stroke="white" stroke-width="1"/></svg>
            Другие студенты
          </span>
        </div>
        ${summaryBlock}
      `;
    }

    function renderCluster(cluster) {
      if (!cluster) {
        setPlaceholder("analytics-cluster", "Нет данных по кластеризации.");
        return;
      }
      const f = cluster.features || {};
      const labels = cluster.feature_labels || {};
      const isNA = cluster.cluster_id === -1;
      const avgScore = Number(f.avg_score || 0);
      const pillTone = avgScore < 60 ? "score-pill-low" : avgScore < 85 ? "score-pill-medium" : "score-pill-high";
      const clusterColor = isNA ? "var(--muted)" : CLUSTER_COLORS[(cluster.cluster_id || 0) % CLUSTER_COLORS.length];

      const improvement = Number(f.improvement || 0);
      const improvColor = improvement > 0 ? "var(--success)" : improvement < 0 ? "var(--danger)" : "var(--muted)";

      $("analytics-cluster").innerHTML = `
        <div class="analytics-page-card">
          <div class="analytics-page-card-head">
            <div class="analytics-page-card-title" style="color:${clusterColor}">
              ${isNA ? "Обзор кластеров" : "Кластер: " + escapeHtml(cluster.cluster_name)}
            </div>
            ${!isNA ? `<div class="analytics-level-pill ${pillTone}">Группа ${escapeHtml(String(cluster.cluster_id + 1))} · ${escapeHtml(String(cluster.peers_count))} чел.</div>` : `<div class="analytics-level-pill">${escapeHtml(String(cluster.total_students))} студентов</div>`}
          </div>
          <div class="analytics-page-card-text">${escapeHtml(cluster.summary)}</div>

          ${!isNA ? `
          <div style="margin:18px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);">Признаки (нормализованы по когорте)</div>
          ${renderFeatureBar(labels.avg_score || "Средний балл", f.avg_score, 100,
              avgScore < 60 ? "var(--danger)" : avgScore < 85 ? "var(--warning)" : "var(--success)")}
          ${renderFeatureBar(labels.test_frequency || "Частота тестов", f.test_frequency, 10, "var(--accent)")}
          ${renderFeatureBar(labels.consistency || "Стабильность", f.consistency, 100,
              Number(f.consistency) > 70 ? "var(--success)" : "var(--warning)")}
          ${renderFeatureBar(labels.subject_breadth || "Охват предметов", f.subject_breadth, 100, "var(--accent-2)")}
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text-soft)">${escapeHtml(labels.improvement || "Динамика")}</span>
            <span style="font-size:14px;font-weight:700;color:${improvColor}">${improvement > 0 ? "+" : ""}${improvement.toFixed(1)}%</span>
          </div>
          ` : ""}
        </div>

        ${renderScatterPlot(cluster.scatter_points, cluster.cluster_centers, cluster.cluster_id)}
      `;
    }

    function renderMlRecommendations(items) {
      if (!items || !items.length) {
        setPlaceholder("analytics-ml-recs", "ML-рекомендации появятся после тестов.");
        return;
      }
      $("analytics-ml-recs").innerHTML = `
        <div class="analytics-page-list">
          ${items.map(item => `
            <div class="analytics-page-card">
              <div class="analytics-page-card-head">
                <div class="analytics-page-card-title">${escapeHtml(item.title)}</div>
                <div class="analytics-level-pill">confidence ${escapeHtml(Math.round((item.confidence || 0) * 100))}%</div>
              </div>
              <div class="analytics-page-card-text">${escapeHtml(item.reason)}</div>
              <div class="analytics-page-card-meta">
                ${(item.actions || []).map(a => `<span>• ${escapeHtml(a)}</span>`).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function addChatMessage(role, text) {
      const log = $("ai-chat-log");
      if (!log) return;
      const cls = role === "assistant" ? "glow-high" : "";
      const who = role === "assistant" ? "AI" : "Вы";
      const div = document.createElement("div");
      div.className = `analytics-page-card ${cls}`;
      div.innerHTML = `
        <div class="analytics-page-card-head">
          <div class="analytics-page-card-title">${escapeHtml(who)}</div>
        </div>
        <div class="analytics-page-card-text">${escapeHtml(text)}</div>
      `;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function askAssistant() {
      const input = $("ai-chat-input");
      const message = (input?.value || "").trim();
      if (!message) return;
      addChatMessage("user", message);
      input.value = "";
      try {
        const res = await Api.request("/ai/assistant", {
          method: "POST",
          auth: true,
          body: { message },
        });
        addChatMessage("assistant", res.reply || "Нет ответа.");
      } catch (e) {
        if (e.message === "SESSION_EXPIRED") return;
        addChatMessage("assistant", "Ошибка: " + e.message);
      }
    }

    function renderStudyPlan(plan) {
      const el = $("analytics-study-plan");
      if (!plan || !plan.items || plan.items.length === 0) {
        setPlaceholder("analytics-study-plan", "Недельный план появится после накопления данных о прогрессе.");
        return;
      }

      el.innerHTML = `
        <div class="analytics-page-card">
          <div class="analytics-page-card-head">
            <div class="analytics-page-card-title">План на ${escapeHtml(plan.horizon_days)} дней</div>
          </div>
          <div class="analytics-page-card-text">${escapeHtml(plan.overview)}</div>
        </div>
        <div class="analytics-page-list" style="margin-top:12px;">
          ${plan.items.map(item => `
            <div class="analytics-page-card">
              <div class="analytics-page-card-head">
                <div class="analytics-page-card-title">${escapeHtml(item.day_label)} · ${escapeHtml(item.title)}</div>
                <div class="analytics-level-pill">${escapeHtml(item.priority)}</div>
              </div>
              <div class="analytics-page-card-meta">
                <span>Тип: ${escapeHtml(item.item_type)}</span>
                <span>Длительность: ${escapeHtml(item.duration_minutes)} мин</span>
                <span>Предмет: ${escapeHtml(item.focus_subject || "—")}</span>
                <span>Тема: ${escapeHtml(item.topic_name || "—")}</span>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    async function safeRequest(path, opts) {
      try {
        return await Api.request(path, opts);
      } catch (e) {
        if (e.message === "SESSION_EXPIRED") throw e;
        return null;
      }
    }

    async function loadAnalytics() {
      try {
        const [progress, history, insights, cluster, mlRecs] = await Promise.all([
          safeRequest("/tests/progress", { auth: true }),
          safeRequest("/tests/history", { auth: true }),
          safeRequest("/tests/insights", { auth: true }),
          safeRequest("/ai/cluster-me", { auth: true }),
          safeRequest("/ai/recommendations-plus", { auth: true }),
        ]);
        renderCharts(progress, history);
        renderProgress(progress);
        renderRecommendations(insights);
        renderCluster(cluster);
        renderMlRecommendations(mlRecs);
      } catch (e) {
        if (e.message === "SESSION_EXPIRED") return;
        setPlaceholder("analytics-charts", "Ошибка: " + e.message, true);
      }
    }

    $("btn-refresh-analytics").addEventListener("click", loadAnalytics);
    $("btn-exit").onclick = () => { Api.setToken(null); window.location.href = "/app/"; };
    $("btn-ai-send").addEventListener("click", askAssistant);
    $("ai-chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") askAssistant();
    });

    // ── Переключение вкладок ──
    document.querySelectorAll("#analytics-tabs .tab").forEach(tab => {
      tab.addEventListener("click", function() {
        const target = this.dataset.tab;
        document.querySelectorAll("#analytics-tabs .tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        this.classList.add("active");
        const panel = document.getElementById("tab-" + target);
        if (panel) panel.classList.add("active");
      });
    });

    applyI18n(document);
    setWhoAmI();
    addChatMessage("assistant", "Привет! Спросите, например: 'В каком я кластере?'");
    loadAnalytics();
  </script>
</body>
</html>
